<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/cuotify_web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CUOTIFY - Sistema inteligente para el control de cuotas y morosidad residencial.">

  <!-- Configuración móvil / PWA -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CUOTIFY">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Título de la pestaña en el navegador -->
  <title>CUOTIFY - Control de Cuotas Residenciales</title>
  <link rel="manifest" href="manifest.json">

  <!-- Estilos del Splash / Pantalla de Carga Inicial -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo-text {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #64ffda; /* Teal Accent de Cuotify */
      margin-bottom: 6px;
    }

    .sub-text {
      font-size: 13px;
      color: #888888;
      margin-bottom: 24px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(100, 255, 218, 0.2);
      border-radius: 50%;
      border-top-color: #64ffda;
      animation: spin 0.8s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Contenedor visual mientras carga el motor de Flutter -->
  <div id="loading-container">
    <div class="logo-text">CUOTIFY</div>
    <div class="sub-text">Cargando plataforma...</div>
    <div class="spinner"></div>
  </div>

  <!-- Cargador oficial de Flutter -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
